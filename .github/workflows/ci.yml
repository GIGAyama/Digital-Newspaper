name: CI

# pull_request と push の両方で動かす。
# push: branches: [main] だけだと、PR の時点で落ちていることに気づけない。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 品質ゲートそのものが正しく動くかを先に確かめる。
      # 検査が壊れていると「0件でした」が意味を持たないため、順序を入れ替えない。
      # Code.gs のシート点検・修整のテスト（tests/schema.test.mjs）も同じ指示で回る。
      - name: 検査そのものを確かめる（わざと壊した入力で）
        run: npm test

      - name: 品質ゲート
        run: npm run check

  # 正本（GIGAyama.github.io/standards/）からコピーしたファイルが、
  # 正本の更新に取り残されていないかを見る。standards-map.json が対応表。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
