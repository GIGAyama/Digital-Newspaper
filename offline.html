<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c3e50">
  <meta name="color-scheme" content="light">
  <title>つながっていません｜デジタル・クラス新聞社</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    /* この画面はネットにつながっていないときに出る。
       だから外部のフォントもCSSも読みに行かない（読みに行けば当然失敗し、
       「壊れた画面」に見えてしまう）。配色と丸みだけ本体に合わせる。 */
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --fs-body:  clamp(15px, 1.6vw + 10px, 18px);
      --fs-title: clamp(21px, 3.2vw + 13px, 32px);
      --navy: #2c3e50;
      --navy-d: #1b2a38;
      --ink: #1f2933;
      --muted: #5f6368;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #eef1f5; color: var(--ink);
      font-size: var(--fs-body); line-height: 1.8; text-align: center;
      font-family: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      touch-action: manipulation;
    }
    .mark {
      width: 88px; height: 88px; border-radius: 24px;
      background: var(--navy); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; box-shadow: 0 8px 24px rgba(44,62,80,.3);
    }
    h1 { margin: 0; font-size: var(--fs-title); }
    p { margin: 0; max-width: 34rem; color: var(--muted); }
    .retry {
      margin-top: 4px; min-height: 52px; min-width: 200px; padding: 12px 28px;
      border: none; border-radius: 999px; background: var(--navy); color: #fff;
      font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer;
      touch-action: manipulation; box-shadow: 0 4px 14px rgba(44,62,80,.35);
    }
    .retry:hover { background: var(--navy-d); }
    .retry:focus-visible { outline: 3px solid #1f4e8c; outline-offset: 3px; }
    .note {
      font-size: .9em; background: #fff; border: 1px solid #dde2e8; border-radius: 14px;
      padding: 14px 18px; max-width: 34rem; text-align: left; color: var(--muted);
    }
    footer { margin-top: 8px; font-size: .8em; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    @media (forced-colors: active) { .retry { border: 2px solid ButtonText; } }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">📰</div>
  <h1>いま インターネットに つながって いません</h1>
  <p>Wi-Fi が つながって いるか たしかめてから、下の ボタンを おしてください。</p>
  <button class="retry" type="button" onclick="location.reload()">もういちど ためす</button>
  <p class="note">
    これまでに 書いた 記事は、この タブレット（パソコン）の 中に のこって います。
    つながると そのまま つづきを 書けます。<br>
    ほかの たんまつと 記事を おくりあう ときだけ インターネットが ひつようです。
  </p>
  <footer>©2026 デジタル・クラス新聞社 GIGA山</footer>
</body>
</html>
